name: Website quality

on:
  pull_request:
  push:
    branches: [main, 'codex/frightertainment-v1']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm run check
      - run: npm run build:preview
      - name: Verify isolated, non-indexable preview bundle
        run: |
          test -f dist/index.html
          test -f dist/assets/frightertainment-brand.png
          test -f dist/films/other-mommy/index.html
          grep -q 'Disallow: /' dist/robots.txt
          grep -q 'X-Robots-Tag: noindex' dist/_headers
          ! test -e dist/worker
          ! test -e dist/.github
          ! test -e dist/API_LICENSING.md
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run validate:worker
      - run: npm run worker:migrations:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
