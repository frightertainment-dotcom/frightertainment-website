name: Website quality

on:
  pull_request:
  push:
    branches: [main, 'codex/frightertainment-v1']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run validate:worker
      - run: npm run worker:migrations:local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
